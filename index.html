<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AG Token Manager</title>
<style>body{font:16px system-ui,sans-serif;background:#f6f7f9;color:#17212b;margin:0}main{max-width:760px;margin:40px auto;padding:20px}section{background:white;padding:24px;border:1px solid #e3e6eb;border-radius:12px;margin:16px 0}input,button,select{padding:11px;border:1px solid #c5ccd4;border-radius:8px;font:inherit}input{max-width:100%;box-sizing:border-box}button{background:#174f9b;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}label{display:block;margin:14px 0 5px}form{margin:0}h1{font-size:24px}h2{font-size:18px}table{border-collapse:collapse;width:100%}th,td{padding:9px;text-align:left;border-bottom:1px solid #eee}small,.muted{color:#596477}#message{white-space:pre-wrap}#tokenOut{font-size:20px;font-weight:700;overflow-wrap:anywhere} .hidden{display:none} .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}</style>
</head><body><main><h1>AG Token Manager</h1><p class="muted">Admin saja · token berawalan AG · hash disimpan di Supabase</p>
<section id="loginBox"><h2>Masuk sebagai admin</h2><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit">Masuk</button></p></form></section>
<div id="app" class="hidden"><section><div class="row"><h2>Token baru</h2><button id="logout" type="button">Keluar</button></div><form id="createForm"><label>Jumlah token (1–20)</label><input id="count" type="number" value="1" min="1" max="20" required><label>Berlaku (hari, 1–30)</label><input id="days" type="number" value="7" min="1" max="30" required><p><button type="submit">Buat token</button></p></form><p class="muted">Simpan atau salin token yang tampil. Kode asli hanya dikembalikan saat pembuatan.</p><div id="tokensOut"></div></section><section><h2>Riwayat token terbaru</h2><p><button id="refresh" type="button">Muat ulang</button></p><div style="overflow:auto"><table><thead><tr><th>Dibuat</th><th>Status</th><th>Kedaluwarsa</th><th>Aksi</th></tr></thead><tbody id="history"></tbody></table></div></section></div>
<section><p id="message" role="status"></p></section><script type="module" src="./app.js"></script></main></body></html>
